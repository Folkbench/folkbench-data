name: Archive daily public snapshots
on:
  schedule:
    - cron: '40 12 * * *'
    - cron: '20 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: daily-public-snapshot
  cancel-in-progress: false
jobs:
  archive:
    if: github.repository == 'Folkbench/folkbench-data' && github.ref == 'refs/heads/main' && vars.PUBLIC_DISTRIBUTION_ENABLED == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Require pinned tooling revision
        env:
          TOOLING_REF: ${{ vars.FOLKBENCH_TOOLING_SHA }}
        run: test "${#TOOLING_REF}" -eq 40 && [[ "$TOOLING_REF" =~ ^[a-f0-9]+$ ]]
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: data
          fetch-depth: 0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Folkbench/folkbench
          ref: ${{ vars.FOLKBENCH_TOOLING_SHA }}
          path: tooling
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - id: snapshot
        run: bun tooling/scripts/distribution/cli.ts archive --root data
      - name: Publish immutable archive through normal hooks
        if: steps.snapshot.outputs.changed == 'true'
        env:
          FOLKBENCH_DISTRIBUTION_TOOL_ROOT: ${{ github.workspace }}/tooling
          SNAPSHOT_VERSION: ${{ steps.snapshot.outputs.snapshot_version }}
        run: |
          git -C data config core.hooksPath .githooks
          git -C data config user.name 'github-actions[bot]'
          git -C data config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C data add daily latest
          git -C data commit -m "数据：归档公开快照（快照 ${SNAPSHOT_VERSION}）"
          git -C data push origin HEAD:main
      - name: Notify the six public snapshot sites
        # Fallback entry beside each site's own schedule. Without a configured token this step only logs and the sites keep their own cron.
        if: success()
        env:
          DISPATCH_TOKEN: ${{ secrets.SUBSITE_DISPATCH_TOKEN }}
          SNAPSHOT_VERSION: ${{ steps.snapshot.outputs.snapshot_version }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then echo 'subsite_dispatch_skipped=token_not_configured'; exit 0; fi
          for repo in Folkbench/relay-rank Folkbench/integrity-weekly ai-relay-bench/ai-relay-bench.github.io aiapi-rank/aiapi-rank.github.io ai-zhongzhuan/ai-zhongzhuan.github.io ai-model-check/ai-model-check.github.io; do
            if GH_TOKEN="$DISPATCH_TOKEN" gh api --method POST "repos/$repo/dispatches" -f event_type=public-snapshot-archived -f "client_payload[snapshot_version]=$SNAPSHOT_VERSION" >/dev/null; then echo "subsite_dispatched=$repo"; else echo "subsite_dispatch_failed=$repo"; fi
          done
      - name: Notify after two failed scheduled days
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun tooling/scripts/distribution/cli.ts failure-alert --root data --repo Folkbench/folkbench-data --workflow daily.yml
